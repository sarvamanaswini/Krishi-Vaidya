<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishi Vaidya — Officials' dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <a class="brand" href="/">🌾 <span>Krishi Vaidya</span></a>
  <nav class="nav-links"><a href="/" data-i18n="back">Farmer site</a></nav>
  <div class="lang-switch"><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="hi">हिं</button><button class="lang-btn" data-lang="te">తె</button></div>
</header>
<main class="dash-main">
  <h2 data-i18n="dash_t"></h2>
  <div class="stat-row">
    <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label" data-i18n="d_total"></span></div>
    <div class="stat"><span class="stat-num" id="stat-pending">0</span><span class="stat-label" data-i18n="d_pending"></span></div>
    <div class="stat"><span class="stat-num" id="stat-diseases">0</span><span class="stat-label" data-i18n="d_types"></span></div>
  </div>
  <section class="stage-card"><h3 data-i18n="d_map"></h3><div id="map" style="height:320px"></div></section>
  <section class="stage-card"><h3 data-i18n="d_by"></h3><div id="disease-breakdown"></div></section>
  <section class="stage-card"><h3 data-i18n="d_recent"></h3>
    <table class="report-table"><tbody id="report-body"></tbody></table></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='i18n.js') }}"></script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
