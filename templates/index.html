<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishi Vaidya — AI Crop Doctor + Weather Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <a class="brand" href="#home">🌾 <span>Krishi Vaidya</span></a>
  <nav class="nav-links">
    <a href="#home" data-i18n="nav_home">Home</a>
    <a href="#how" data-i18n="nav_how">How it works</a>
    <a href="#diagnose" data-i18n="nav_diag">Diagnose</a>
    <a href="/dashboard" data-i18n="nav_dash">Officials' dashboard</a>
  </nav>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="hi">हिं</button>
    <button class="lang-btn" data-lang="te">తె</button>
  </div>
</header>

<section class="hero" id="home">
  <div class="wrap hero-grid">
    <div>
      <h1 data-i18n="hero_h">Catch crop disease before it spreads</h1>
      <p class="lead" data-i18n="hero_p"></p>
      <div class="cta-row">
        <a class="btn" href="#diagnose" data-i18n="hero_cta">Diagnose a leaf</a>
        <a class="btn ghost" href="#how" data-i18n="hero_cta2">How it works</a>
      </div>
    </div>
    <div class="hero-visual" aria-hidden="true">
      <div class="leaf-art">🍃</div>
      <div class="mini-bar"><b>Tomato — Early Blight</b><span>91%</span></div>
      <div class="mini-gauge"><i style="width:72%"></i></div>
    </div>
  </div>
</section>

<section class="section alt" id="how">
  <div class="wrap">
    <h2 data-i18n="how_h">How Krishi Vaidya works</h2>
    <ol class="how-list">
      <li><b>1</b><span data-i18n="s1"></span></li>
      <li><b>2</b><span data-i18n="s2"></span></li>
      <li><b>3</b><span data-i18n="s3"></span></li>
      <li><b>4</b><span data-i18n="s4"></span></li>
      <li><b>5</b><span data-i18n="s5"></span></li>
      <li><b>6</b><span data-i18n="s6"></span></li>
    </ol>
  </div>
</section>

<section class="section" id="diagnose">
  <div class="wrap narrow">
    <h2 data-i18n="diag_h">Diagnose your crop</h2>
    <ol class="pipeline" id="pipeline"><li class="active"></li><li></li><li></li><li></li><li></li><li></li></ol>

    <div class="form-row">
      <label><span data-i18n="crop_l">Crop</span>
        <select id="crop-input">
          <option value="any" data-i18n="any">Not sure</option>
          <option value="tomato" data-i18n="c_tomato">Tomato</option>
          <option value="potato" data-i18n="c_potato">Potato</option>
          <option value="wheat" data-i18n="c_wheat">Wheat</option>
          <option value="rice" data-i18n="c_rice">Rice</option>
          <option value="maize" data-i18n="c_maize">Maize</option>
          <option value="chilli" data-i18n="c_chilli">Chilli</option>
          <option value="mango" data-i18n="c_mango">Mango</option>
          <option value="groundnut" data-i18n="c_groundnut">Groundnut</option>
          <option value="onion" data-i18n="c_onion">Onion</option>
        </select></label>
      <input type="text" id="location-input" data-i18n-ph="loc_ph" value="Guntur">
    </div>

    <label for="photo-input" class="dropzone" id="dropzone">
      <span class="dropzone-icon">📷</span>
      <span id="dropzone-text" data-i18n="up">Tap to upload or take a leaf photo</span>
      <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
    </label>
    <details class="sensor-details"><summary data-i18n="sensor"></summary>
      <div class="sensor-fields"><input type="number" id="sensor-temp" data-i18n-ph="temp"><input type="number" id="sensor-humidity" data-i18n-ph="hum"></div>
    </details>

    <section class="stage-card" id="diagnosis-card" hidden>
      <h3 data-i18n="r_diag"></h3>
      <div class="diagnosis-bar" id="diagnosis-bar">
        <div><p class="diagnosis-name" id="diagnosis-name"></p><p class="diagnosis-meta" id="diagnosis-meta"></p></div>
        <div class="confidence-ring" id="confidence-value"></div>
      </div>
    </section>

    <section class="stage-card" id="risk-card" hidden>
      <h3 data-i18n="r_risk"></h3>
      <div class="risk-gauge"><div class="risk-fill" id="risk-fill"></div></div>
      <p class="risk-text" id="risk-text"></p>
      <div class="forecast-row" id="forecast-row"></div>
    </section>

    <section class="stage-card" id="recommend-card" hidden>
      <h3 data-i18n="r_act"></h3>
      <p class="urgency" id="urgency-text"></p>
      <ol class="steps-list" id="steps-list"></ol>
      <p class="rec-line" id="dosage-line"></p>
      <p class="rec-line" id="organic-line"></p>
      <p class="referral-line" id="referral-line" hidden></p>
      <button class="expert-btn" id="expert-btn" data-i18n="flag"></button>
      <p class="expert-status" id="expert-status"></p>
      <p class="disc" data-i18n="disc"></p>
    </section>

    <section class="stage-card" id="chat-card" hidden>
      <h3 data-i18n="r_ask"></h3>
      <div class="chat-thread" id="chat-thread"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" data-i18n-ph="chat_ph">
        <button id="chat-send" data-i18n="send"></button>
        <button id="chat-mic" title="🎤">🎤</button>
      </div>
    </section>
    <div class="again-row"><button class="btn" id="again-btn" hidden data-i18n="btn_again">Diagnose another leaf</button></div>
  </div>
</section>

<footer class="footer"><div class="wrap"><span data-i18n="foot"></span></div></footer>
<script src="{{ url_for('static', filename='i18n.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
